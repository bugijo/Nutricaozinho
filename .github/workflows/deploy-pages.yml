name: Publicar demo (GitHub Pages)

# Publica a versão de demonstração (mock, sem backend) no GitHub Pages.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm install

      - name: Build (modo demonstração / mock)
        working-directory: frontend
        run: npx vite build --base=./
        env:
          VITE_USE_MOCK: 'true'
          VITE_USE_HASH: 'true'

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v4
